# Ruleset for `poe lint-schema`. It extends the IBM Cloud OpenAPI ruleset and records where
# Menagerist deliberately differs; the reasons are in docs/API_STYLE.md. Only errors fail
# the check, so a rule that still has findings is "warn" until they are fixed, then "error".
extends: "@ibm-cloud/openapi-ruleset"

rules:
  # --- Deliberate divergences (off) -------------------------------------------------
  # Lists are bare arrays; paging is keyset (`after`/`limit`) with `Link` and `Total-Count` headers.
  # The envelope's named array property follows from that, so it is off too.
  ibm-no-array-responses: off
  ibm-collection-array-property: off
  # FastAPI declares path parameters on each operation, not once on the path item.
  ibm-avoid-repeating-path-parameters: off
  # Field values, preset definitions, search queries and the settings JSON Schema are
  # free-form JSON by design; field types validate them, not the OpenAPI schema.
  ibm-well-defined-dictionaries: off
  # Errors are RFC 9457 `application/problem+json`, not `application/json`.
  ibm-error-content-type-is-json: off
  # FastAPI answers invalid payloads with 422 and the generated client depends on it.
  ibm-response-status-codes: off
  # `node-types` and `edge-types` are pinned by test_openapi_path_style.py.
  ibm-path-segment-casing-convention: off
  # Ids are uuid7, so `/backups/prune` cannot clash with `/backups/{backup_id}`.
  ibm-no-ambiguous-paths: off
  # Pydantic emits OpenAPI 3.1 `anyOf: [X, {type: null}]`, which this rule does not understand.
  ibm-schema-type-format: off
  # FastAPI inlines response models; naming them would change generated client types.
  ibm-avoid-inline-schemas: off
  # Request models are `XxxRequest` (backend/README.md), not IBM's `...Prototype` and `...Patch`.
  ibm-schema-naming-convention: off
  # Bounds and formats on every string, integer and array are noise; add them where they carry meaning.
  ibm-string-attributes: off
  ibm-integer-attributes: off
  ibm-array-attributes: off
  # Operation ids are `verb_noun` with the domain's verbs (`revoke_session`,
  # `install_example_pack`); IBM derives them from the path (`create_node-type`).
  ibm-operationid-naming-convention: off
  # Errors are RFC 9457 problems (`errors` only on validation, no `trace`), and the
  # health probes follow draft-inadarei-api-health-check.
  ibm-error-response-schemas: off
  # OpenAPI 3.1 is JSON Schema 2020-12: `$ref` may have siblings, and `const` and
  # `contentMediaType` are valid keywords.
  no-$ref-siblings: off
  ibm-schema-keywords: off
  # The health probes and the web app manifest sit outside the versioned `/api/v1`.
  ibm-major-version-in-path: off
  # Self-hosted: each instance has its own origin, so there is no server to name.
  oas3-api-servers: off

  # --- Fixed, and kept that way -----------------------------------------------------
  # Recurring parameters take their description from entrypoints/api/shared/http/parameters.py.
  ibm-parameter-description: error
  # ConditionalGetDep and ConditionalPatchDep declare If-None-Match and If-Match.
  ibm-precondition-headers: error
  # A failed If-Match answers with a problem body, like every other 4xx.
  ibm-request-and-response-content: error

  # Contract findings that are now zero; the exceptions are scoped in `overrides`.
  ibm-enum-casing-convention: error
  ibm-property-casing-convention: error
  ibm-required-array-properties-in-response: error
  ibm-accept-and-return-models: error
  ibm-dont-require-merge-patch-properties: error
  ibm-use-date-based-format: error
  ibm-resource-response-consistency: error
  ibm-content-contains-schema: error
  ibm-no-operation-requestbody: error
  oas3-unused-component: error

  # Every property and schema is described. Success examples are lifted from each
  # response model's own example (entrypoints/api/openapi_examples.py).
  ibm-property-description: error
  ibm-schema-description: error
  ibm-success-response-example: error

# Exceptions for single schemas or paths, so each rule still guards everything else.
overrides:
  # Permissions are scope-style `module:resource:action` strings with snake_case
  # parts, like OAuth scopes. A new module's permission enum joins this list.
  - files:
      - "**#/components/schemas/BackupPermission"
      - "**#/components/schemas/CataloguePermission"
      - "**#/components/schemas/CollectionPermission"
      - "**#/components/schemas/ExamplePermission"
      - "**#/components/schemas/GraphPermission"
      - "**#/components/schemas/IdentityPermission"
      - "**#/components/schemas/MediaPermission"
      - "**#/components/schemas/PresetPermission"
      - "**#/components/schemas/SchedulingPermission"
      - "**#/components/schemas/SettingsPermission"
      - "**#/components/schemas/SystemPermission"
      - "**#/components/schemas/TransferPermission"
    rules:
      ibm-enum-casing-convention: "off"
  # draft-inadarei-api-health-check names these properties in camelCase.
  - files: ["**#/components/schemas/CheckObservation"]
    rules:
      ibm-property-casing-convention: "off"
  # A preset file's entries are also read on import, where a missing list means empty.
  - files:
      - "**#/components/schemas/BundleCollectionEntry"
      - "**#/components/schemas/BundleItemEntry"
    rules:
      ibm-required-array-properties-in-response: "off"
  # Each of these PATCH bodies has one field, and that field is the change.
  - files:
      - "**#/components/schemas/RenameDeviceRequest"
      - "**#/components/schemas/UpdateMeRequest"
      - "**#/components/schemas/UpdateMediaRequest"
      - "**#/components/schemas/UpdateSettingsRequest"
    rules:
      ibm-dont-require-merge-patch-properties: "off"
  # `created` is a count of what an import added, not a date.
  - files: ["**#/components/schemas/ImportResultResponse"]
    rules:
      ibm-use-date-based-format: "off"
  # The settings schemas are JSON Schema documents, and the instance and personal
  # settings are lists that PATCH returns in the same shape as GET.
  - files:
      - "**#/paths/~1api~1v1~1settings~1schema"
      - "**#/paths/~1api~1v1~1me~1settings~1schema"
    rules:
      ibm-accept-and-return-models: "off"
  - files:
      - "**#/paths/~1api~1v1~1settings~1instance"
      - "**#/paths/~1api~1v1~1me~1settings"
    rules:
      ibm-resource-response-consistency: "off"
