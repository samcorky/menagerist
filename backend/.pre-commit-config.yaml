repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: name-tests-test
        args:
          - --pytest-test-first

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or:
          - python
          - pyi

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or:
          - python
          - pyi

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
