[project]
name = "menagerist"
dynamic = ["version"]
description = "A lightweight, self-hostable and flexible platform for organising the things you care about."
requires-python = ">=3.14"
license = "Apache-2.0"

dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "cyclopts>=5.3.2",
    "fastapi>=0.162.0",
    "granian>=2.8.7",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "alembic>=1.20.1",
    "aiofiles>=25.1.0",
    "python-multipart>=0.0.33",
    "filetype>=1.2.0",
    "Pillow>=13.0.0",
    "jsonschema>=4.26.0",
    "cronsim>=2.8",
    "httpx2>=2.16.0",
    "starlette-compress>=2.0.0",
]

[dependency-groups]
# Just the CalVer CLI, so release workflows can run it from the lockfile without
# installing the whole dev group.
release = [
    "calver-scm[cli]>=1.10.0",
]
dev = [
    { include-group = "release" },
    "archunitpython>=1.8.1",
    "docker>=7.2.0",
    "granian[reload]>=2.8.7",
    "hatch>=1.18.2",
    "hatchling==1.33.0",
    "mypy>=2.4.1",
    "openapi-spec-validator>=0.9.0",
    "psycopg[binary]>=3.3.6",
    "pycountry>=26.2.16", # lets mypy check scripts/generate_iso_data.py, which pins its own
    "pytest>=9.2.0",
    "pytest-alembic>=0.13.2",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pywin32>=312; sys_platform == 'win32'",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
    "time-machine>=3.6.0",
    "types-aiofiles>=25.1.0.20260518",
    "types-docker>=7.2.0.20261006",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261030",
]

[project.urls]
# Last-resort repository for the update check. A fork sets
# MENAGERIST_BUILD_REPOSITORY_URL, or it reports upstream's releases.
Repository = "https://github.com/samcorky/menagerist"

[project.scripts]
menagerist = "app.entrypoints.cli:app.meta"

[build-system]
requires = [
    "hatchling==1.33.0",
    "hatch-vcs==0.5.0",
    "calver-scm==1.10.0"
]

build-backend = "hatchling.build"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "src/**" },
    { file = "scripts/hatch_build_info.py" },
    { file = "scripts/git_info.py" },
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build_info.py"

[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "calver-scm"
local_scheme = "no-local-version"

[tool.calver-scm]
stable = false

[tool.ruff]
fix = true
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
    "D",
    "UP",
    "B",
    "C4",
    "N",
    "SIM",
    "TC",
    "PT",
    "ANN",
    "TID",
    "RUF",
    "ISC",
    "UP037"
]
ignore = [
    # Conflicts with Ruff formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",

    # Project-specific.
    "B008",
    "D100",
    "D104",
    "D107",
    "TC006",
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "`from __future__ import annotations` is banned; this project targets Python 3.14, where it is deprecated, and runtime frameworks need annotations to be resolvable."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
    "sqlalchemy.orm.mapped_as_dataclass",
    "sqlalchemy.orm.registry.mapped_as_dataclass",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.api_route",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-provider functions (get_x, referenced only via Depends(get_x)
# elsewhere) need their annotations resolvable at runtime, same as a route handler -
# but they aren't decorated, so `runtime-evaluated-decorators` above can't detect
# them and flake8-type-checking flags the imports as type-only.
"**/dependencies.py" = ["TC001", "TC002", "TC003", "D103"]
# SQLAlchemy's declarative mapper evaluates `Mapped[...]` annotations at class-
# definition time - `runtime-evaluated-base-classes` above doesn't catch this
# through our custom `Base` + mixins, so flake8-type-checking still flags these
# as type-only. Moving them into `TYPE_CHECKING` breaks the mapper (verified).
"**/adapters/persistence/models.py" = ["TC003"]
"**/platform/orm_mixins.py" = ["TC003"]
# Alembic-generated migration scripts - mechanically produced, reviewed for
# correctness rather than style.
"**/alembic/versions/*.py" = ["D103", "D415", "W291", "TC003"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src/app", "tests", "scripts", "../scripts"]
mypy_path = "src:scripts"
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No --cov here: only the poe test tasks pass it, so an ad-hoc pytest run never
# overwrites the combined .coverage data the coverage gate reads.
markers = [
    "integration: exercises a real adapter (database, network) instead of an in-memory fake",
    "docker: starts a Docker container through testcontainers (needs a running Docker daemon), added from the fixtures a test uses in conftest.py",
    "fast: quick in-memory tests (domain, application, shared kernel, architecture, platform), added by location in conftest.py; what the pre-commit hook runs",
    "real_actor: keep the real get_current_actor instead of the default member override",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
]
