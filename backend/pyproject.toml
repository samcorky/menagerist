[project]
name = "menagerist"
dynamic = ["version"]
description = "A lightweight, self-hostable and flexible platform for organising the things you care about."
requires-python = ">=3.14"
license = "Apache-2.0"

dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "cyclopts>=4.23.1",
    "fastapi>=0.141.1",
    "granian>=2.8.1",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "archunitpython>=1.5.0",
    "granian[reload]>=2.8.1",
    "hatch>=1.18.0",
    "hatchling==1.32.0",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-alembic>=0.12.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "testcontainers[postgres]>=4.15.0",
]

[project.scripts]
menagerist = "app.entrypoints.cli:app"

[build-system]
requires = [
    "hatchling==1.32.0",
    "hatch-vcs==0.5.0",
    "calver-scm==1.4.1"
]

build-backend = "hatchling.build"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "src/**" },
    { file = "scripts/hatch_build_info.py" },
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build_info.py"

[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "calver-scm"
local_scheme = "no-local-version"

[tool.calver-scm]
stable = false

[tool.ruff]
fix = true
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "C90",
    "D",
    "UP",
    "B",
    "C4",
    "N",
    "SIM",
    "TC",
    "PT",
    "ANN",
    "TID",
    "RUF",
    "ISC",
    "UP"
]
ignore = [
    # Conflicts with Ruff formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "W191",

    # Project-specific.
    "B008",
    "D100",
    "D104",
    "D107",
    "TC006",
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "`from __future__ import annotations` is banned; this project targets Python 3.14, where it is deprecated, and runtime frameworks need annotations to be resolvable."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
    "sqlalchemy.orm.mapped_as_dataclass",
    "sqlalchemy.orm.registry.mapped_as_dataclass",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.api_route",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency-provider functions (get_x, referenced only via Depends(get_x)
# elsewhere) need their annotations resolvable at runtime, same as a route handler -
# but they aren't decorated, so `runtime-evaluated-decorators` above can't detect
# them and flake8-type-checking flags the imports as type-only.
"**/dependencies.py" = ["TC001", "TC002", "TC003"]
# SQLAlchemy's declarative mapper evaluates `Mapped[...]` annotations at class-
# definition time - `runtime-evaluated-base-classes` above doesn't catch this
# through our custom `Base` + mixins, so flake8-type-checking still flags these
# as type-only. Moving them into `TYPE_CHECKING` breaks the mapper (verified).
"**/adapters/persistence/models.py" = ["TC003"]
"**/platform/orm_mixins.py" = ["TC003"]
# Alembic-generated migration scripts - mechanically produced, reviewed for
# correctness rather than style.
"alembic/versions/*.py" = ["D103", "D415", "W291", "TC003"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
files = ["src/app"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real adapter (database, network) instead of an in-memory fake",
]
