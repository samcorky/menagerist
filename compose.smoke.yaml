# Isolate the smoke-test stack from a running development stack.
name: menagerist-smoke
services:
  postgres:
    container_name: db

  menagerist:
    container_name: app
    ports: !override
      - "18080:8000"

networks:
  # Linux bridge names are limited to 15 characters.
  menagerist:
    driver_opts:
      com.docker.network.bridge.name: mgr-smoke
