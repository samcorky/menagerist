x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  tmpfs:
    # Restrict tmpfs use and pin ownership to uid/gid 1000.
    - /tmp:mode=1700,size=512M,noexec,nosuid,nodev,uid=1000,gid=1000
    - /var/run:mode=1700,size=16M,noexec,nosuid,nodev,uid=1000,gid=1000
  user: "1000:1000"
  networks:
    - menagerist
  env_file:
    - path: .env
      required: false

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: menagerist-db
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      # The entrypoint chowns these paths before dropping privileges.
      - /tmp:mode=1777,size=256M,noexec,nosuid,nodev
      - /var/run:mode=1777,size=16M,noexec,nosuid,nodev
      - /run/postgresql:mode=1777,size=16M,noexec,nosuid,nodev
    environment:
      POSTGRES_USER: menagerist
      POSTGRES_PASSWORD: menagerist
      POSTGRES_DB: menagerist
      POSTGRES_INITDB_ARGS: -c log_connections=on -c log_disconnections=on
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menagerist -d menagerist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menagerist

  menagerist:
    <<: [*hardened, *logging]
    container_name: menagerist
    image: menagerist:local
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--migrate"]
    restart: unless-stopped
    environment: &app-environment
      TZ: ${TZ:-UTC}
      MENAGERIST_DATABASE_URL: postgresql+asyncpg://menagerist:menagerist@postgres:5432/menagerist
      # Behind a reverse proxy, set its subnet to preserve client IPs and allow HTTPS sign-in.
      # MENAGERIST_TRUSTED_PROXIES: 172.18.0.0/16
    volumes: &app-volumes
      # The backups bind mount must be owned by uid/gid 1000.
      - media-data:/data/media
      - ./backups:/data/backups
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: [*hardened, *logging]
    container_name: menagerist-worker
    image: menagerist:local
    mem_limit: 512m
    command: ["worker"]
    healthcheck:
      test: ["CMD", "menagerist", "worker-health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 45s
    environment: *app-environment
    volumes: *app-volumes
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  media-data:
    driver: local

networks:
  menagerist:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: menagerist
