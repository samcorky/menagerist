x-app: &app
  image: ${MENAGERIST_IMAGE:-ghcr.io/samcorky/menagerist:latest}
  mem_limit: 512m
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:mode=1700,size=512M,noexec,nosuid,nodev,uid=1000,gid=1000
    - /var/run:mode=1700,size=16M,noexec,nosuid,nodev,uid=1000,gid=1000
  user: "1000:1000"
  networks:
    - menagerist
  env_file:
    - path: .env
      required: false
  environment:
    MENAGERIST_DATABASE_HOST: postgres
    MENAGERIST_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-menagerist}
  volumes:
    - media-data:/data/media
    - ./backups:/data/backups
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    container_name: menagerist-db
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      - /tmp:mode=1777,size=256M,noexec,nosuid,nodev
      - /var/run:mode=1777,size=16M,noexec,nosuid,nodev
      - /run/postgresql:mode=1777,size=16M,noexec,nosuid,nodev
    environment:
      POSTGRES_USER: menagerist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menagerist}
      POSTGRES_DB: menagerist
      POSTGRES_INITDB_ARGS: -c log_connections=on -c log_disconnections=on
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menagerist -d menagerist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menagerist

  menagerist:
    <<: *app
    container_name: menagerist
    command: ["serve", "--host", "0.0.0.0", "--migrate"]
    ports:
      - "8080:8000"

  worker:
    <<: *app
    container_name: menagerist-worker
    hostname: menagerist-worker
    command: ["worker"]
    healthcheck:
      test: ["CMD", "menagerist", "worker-health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    stop_grace_period: 45s

volumes:
  postgres-data:
    driver: local
  media-data:
    driver: local

networks:
  menagerist:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: menagerist
