x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  tmpfs:
    # noexec/nosuid/nodev block these tmpfses from being used to smuggle in
    # or run anything; sizes are caps, not reservations. uid/gid pin
    # ownership to the anchor's own user: "1000:1000".
    - /tmp:mode=1700,size=512M,noexec,nosuid,nodev,uid=1000,gid=1000
    - /var/run:mode=1700,size=16M,noexec,nosuid,nodev,uid=1000,gid=1000
  user: "1000:1000"
  networks:
    - menagerist
  env_file:
    - path: .env
      required: false

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: menagerist-db
    restart: unless-stopped
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      # noexec/nosuid/nodev as elsewhere. No uid/gid pin: the entrypoint
      # runs as root initially and chowns these to its own postgres uid
      # before dropping privileges (that's what SETUID/SETGID/CHOWN/
      # DAC_OVERRIDE below are for) — pinning ownership here would fight it.
      - /tmp:mode=1777,size=256M,noexec,nosuid,nodev
      - /var/run:mode=1777,size=16M,noexec,nosuid,nodev
      - /run/postgresql:mode=1777,size=16M,noexec,nosuid,nodev
    environment:
      POSTGRES_USER: menagerist
      POSTGRES_PASSWORD: menagerist
      POSTGRES_DB: menagerist
      POSTGRES_INITDB_ARGS: -c log_connections=on -c log_disconnections=on
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menagerist -d menagerist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menagerist

  menagerist:
    <<: [*hardened, *logging]
    container_name: menagerist
    image: menagerist:local
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--migrate"]
    restart: unless-stopped
    environment:
      MENAGERIST_DATABASE_URL: postgresql+asyncpg://menagerist:menagerist@postgres:5432/menagerist
    volumes:
      - media-data:/data/media
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  media-data:
    driver: local

networks:
  menagerist:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: menagerist
