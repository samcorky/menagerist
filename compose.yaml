services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: menagerist
      POSTGRES_PASSWORD: menagerist
      POSTGRES_DB: menagerist
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menagerist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
