x-hardened: &hardened
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - NET_BIND_SERVICE
  tmpfs:
    # noexec/nosuid/nodev block these tmpfses from being used to smuggle in
    # or run anything; sizes are caps, not reservations. uid/gid pin
    # ownership to the anchor's own user: "1000:1000".
    - /tmp:mode=1700,size=512M,noexec,nosuid,nodev,uid=1000,gid=1000
    - /var/run:mode=1700,size=16M,noexec,nosuid,nodev,uid=1000,gid=1000
  user: "1000:1000"
  networks:
    - menagerist

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    container_name: menagerist-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    read_only: false
    tmpfs:
      # noexec/nosuid/nodev as elsewhere. No uid/gid pin: the entrypoint
      # runs as root initially and chowns these to its own postgres uid
      # before dropping privileges (that's what SETUID/SETGID/CHOWN/
      # DAC_OVERRIDE below are for) — pinning ownership here would fight it.
      - /tmp:mode=1777,size=256M,noexec,nosuid,nodev
      - /var/run:mode=1777,size=16M,noexec,nosuid,nodev
      - /run/postgresql:mode=1777,size=16M,noexec,nosuid,nodev
    environment:
      POSTGRES_USER: menagerist
      POSTGRES_PASSWORD: menagerist
      POSTGRES_DB: menagerist
      POSTGRES_INITDB_ARGS: -c log_connections=on -c log_disconnections=on
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menagerist -d menagerist"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - menagerist

  migrate:
    <<: [*hardened, *logging]
    container_name: menagerist-migrate
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["migrate", "upgrade"]
    environment:
      MENAGERIST_DATABASE_URL: postgresql+asyncpg://menagerist:menagerist@postgres:5432/menagerist
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  backend:
    <<: [*hardened, *logging]
    container_name: menagerist-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      MENAGERIST_DATABASE_URL: postgresql+asyncpg://menagerist:menagerist@postgres:5432/menagerist
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    <<: [*hardened, *logging]
    container_name: menagerist-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    # ammnt/nginx chowns /etc/nginx to 10001:10001 at 550/440 — overrides
    # the hardened anchor's 1000:1000, which can't traverse those dirs.
    user: "10001:10001"
    tmpfs:
      # noexec/nosuid/nodev block this tmpfs from being used to smuggle in
      # or run anything; size is a cap, not a reservation, so 1G costs
      # nothing at rest. uid/gid pin ownership regardless of process user.
      - /tmp:mode=1700,size=1G,noexec,nosuid,nodev,uid=10001,gid=10001
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local

networks:
  menagerist:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: menagerist
