name: Bug report
description: Something does not work as it should
title: "[bug] "
labels: [bug]
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Run `menagerist --version`, or give the image tag.
      placeholder: 0.2026.11.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system and reverse proxy, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove anything private first.
      render: shell
