name: Publish

# Builds the image on a native runner for each platform and pushes it to GHCR.
#   - a published release:  <version> and latest
#   - a push to main:       edge and sha-<commit>
#   - run by hand:          a build only, unless "push" is ticked (sha-<commit>, plus
#                           edge when run from main)
# The image is smoke tested (build.yml) before anything is pushed.
on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR (otherwise build only)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never abandon a release half way; a newer push to main replaces an older one.
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  # GHCR needs a lower-case name; the repository is already lower case.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is worked out from the tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Fails on a broken CalVer config; warns about a shallow clone or no tag yet.
      - name: Check the CalVer setup
        working-directory: backend
        run: uv run --locked --only-group release calver-scm doctor

      - name: Read the version from the tags
        id: version
        run: |
          version="$(cd backend && uv run --locked --only-group release calver-scm --format plain version)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${version}"
            echo "timestamp=${timestamp}"
          } | tee -a "$GITHUB_OUTPUT"

      # A release is built from its tag, so the two must agree.
      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: backend
        run: |
          uv run --locked --only-group release calver-scm validate "$TAG" --tag
          if [[ "${TAG#v}" != "$VERSION" ]]; then
            echo "::error::The release tag is '${TAG}' but the version built from it is '${VERSION}'. Tags look like 0.YYYY.MM.PATCH."
            exit 1
          fi

  tags:
    name: Work out the tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=edge
            type=pep440,pattern={{version}}
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Show the tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}, ref: ${GITHUB_REF}, pushed: ${PUSH}"
          echo "Tags:"
          echo "$TAGS"
          {
            echo "### Image tags (pushed: ${PUSH})"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Build and smoke test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  image:
    name: Build ${{ matrix.platform }}
    needs: [version, smoke]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Name the platform for file names
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Show the build arguments
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_TIMESTAMP: ${{ needs.version.outputs.timestamp }}
          PLATFORM: ${{ matrix.platform }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          args="$(printf '%s\n' \
            "platform=${PLATFORM}" \
            "image=${REGISTRY_IMAGE}" \
            "pushing=${PUSH}" \
            "VERSION=${VERSION}" \
            "COMMIT_SHA=${COMMIT_SHA}" \
            "BRANCH=${BRANCH}" \
            "REPOSITORY_URL=${REPOSITORY_URL}" \
            "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" \
            "DIRTY=false")"
          echo "$args"
          {
            echo "### Build arguments (${PLATFORM})"
            echo
            echo '```'
            echo "$args"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Pushed by digest with no tag; the publish job below puts the tags on the
      # combined multi-platform image.
      - name: Build the image
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_TIMESTAMP: ${{ needs.version.outputs.timestamp }}
          DIRTY: "false"
        with:
          # The Dockerfile reads .git from the build context, so build the checkout.
          source: .
          files: docker-bake.hcl
          targets: menagerist
          set: |
            *.tags=
            *.platform=${{ matrix.platform }}
            *.output=${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY_IMAGE) || 'type=cacheonly' }}
            *.cache-from=type=gha,scope=publish-${{ env.PLATFORM_PAIR }}
            *.cache-to=type=gha,mode=max,scope=publish-${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        if: env.PUSH == 'true'
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="$(jq -r '.menagerist["containerimage.digest"]' <<< "$METADATA")"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the multi-platform image
    needs: [tags, image]
    if: github.event_name != 'workflow_dispatch' || inputs.push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the combined image
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          sources=()
          for digest in *; do
            sources+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          echo "Combining ${#sources[@]} platform image(s) into: ${tag_args[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect the image
        env:
          VERSION_TAG: ${{ needs.tags.outputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION_TAG}"
