name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Prek Checks (Lint, Typecheck, Unit Tests)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --all-packages --group dev
          npm --prefix frontend ci

      - name: Run prek
        id: prek
        continue-on-error: true
        uses: j178/prek-action@v3.0.0
        with:
          extra-args: --all-files

      - name: Auto-commit hook fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(style): auto-apply pre-commit fixes"
          branch: ${{ github.head_ref }}

      - name: Verify all checks pass
        if: steps.prek.outcome != 'success'
        run: uv run prek run --all-files
