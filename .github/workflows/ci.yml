name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Fail rather than update uv.lock; poe's sync tasks pass this on to uv.
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch replaces its older run, but every commit on main keeps its
  # own, so a quick second merge does not leave the first without a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Work out which jobs are needed
    # A pull request that only changes documentation or repository housekeeping skips the
    # test jobs; see scripts/ci_changes.py for the rules. Everything else runs them all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Classify the changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run --script scripts/ci_changes.py

  typecheck-backend:
    name: Backend type check (mypy)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Run mypy
        run: uv run poe typecheck-backend

  generated-files:
    # A matrix so each generated file reports as its own check on the pull request.
    name: Generated files (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings reference is current
            task: check-settings-docs
          - name: API schema is current
            task: check-schema
          # About 20 seconds, too slow for pre-commit; the file is the committed
          # contract, which check-schema ties to the live API.
          - name: API schema is valid
            task: validate-schema
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Check ${{ matrix.name }}
        run: uv run poe ${{ matrix.task }}

  typecheck-frontend:
    name: Frontend type check (svelte-check)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Run svelte-check
        run: uv run poe typecheck-frontend

  frontend-tests:
    name: Frontend unit tests (Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Run the frontend unit tests with coverage
        run: uv run poe coverage-frontend
        env:
          COMPONENT_COVERAGE_COMMENT: ${{ runner.temp }}/component-coverage.md
          JUNIT_XML_DIR: junit-reports

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Failing tests are the point, so upload even when the run above failed.
      - name: Upload frontend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: junit-reports/frontend.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # The coverage-comment job joins this with the backend table.
      - name: Upload the frontend coverage table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: ${{ runner.temp }}/component-coverage.md
          if-no-files-found: ignore
          retention-days: 1

  integration:
    name: Backend Tests and Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Run backend unit and integration tests and enforce coverage
        run: uv run poe coverage
        env:
          COMPONENT_COVERAGE_COMMENT: ${{ runner.temp }}/component-coverage.md
          JUNIT_XML_DIR: junit-reports

      # The coverage-comment job joins this with the frontend summary.
      - name: Upload the component coverage table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: ${{ runner.temp }}/component-coverage.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Failing tests are the point, so upload even when the run above failed.
      - name: Upload backend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: junit-reports/backend-unit.xml,junit-reports/backend-integration.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-shards:
    name: End-to-end shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium (a no-op when cached)
        run: uv run poe install-e2e-browser

      - name: Install the system libraries Chromium needs
        # About 10-35s normally; a stalled apt mirror has held it for 15 minutes.
        timeout-minutes: 3
        uses: ./.github/actions/playwright-system-libraries
        with:
          browsers: chromium

      - name: Run end-to-end tests
        run: uv run poe test-e2e --no-generate --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # The report job merges these into one report and job summary.
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: frontend/blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: End-to-end report
    if: ${{ !cancelled() && needs.e2e-shards.result != 'skipped' }}
    needs: e2e-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge the shards into one report and summary
        run: >-
          npx playwright merge-reports
          --reporter=html,./tests/e2e/reporters/job-summary.ts
          ./all-blob-reports
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload the merged HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-cookies:
    name: End-to-end cookies (WebKit, Firefox)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cookies-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium, WebKit and Firefox (a no-op when cached)
        run: |
          uv run poe install-e2e-browser
          uv run poe install-e2e-cookie-browsers

      - name: Install the system libraries the browsers need
        # About 10-35s normally; a stalled apt mirror has held it for 15 minutes.
        timeout-minutes: 3
        uses: ./.github/actions/playwright-system-libraries
        with:
          browsers: chromium webkit firefox

      - name: Run cookie tests in WebKit and Firefox
        run: uv run poe test-e2e-cookies --no-generate

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-cookies
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end Tests (Playwright)
    # Keeps one stable check name for branch protection however the suite is split.
    if: always()
    needs: [e2e-shards, e2e-cookies]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every end-to-end job to pass
        env:
          SHARDS: ${{ needs.e2e-shards.result }}
          COOKIES: ${{ needs.e2e-cookies.result }}
        run: |
          echo "shards: ${SHARDS}, cookies: ${COOKIES}"
          # Both are skipped when nothing the tests cover has changed.
          for result in "${SHARDS}" "${COOKIES}"; do
            case "${result}" in success|skipped) ;; *) exit 1 ;; esac
          done

  build:
    name: Build and smoke test the image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  coverage-comment:
    name: Comment coverage on the pull request
    # Codecov's free plan posts only a short patch comment, so show the backend component
    # table and the frontend figures ourselves, in one comment that later pushes update.
    # Fork pull requests get a read-only token and are skipped. Not part of ci-passed: a
    # missing comment should not fail a pull request.
    needs: [integration, frontend-tests]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/coverage_comment.py
          sparse-checkout-cone-mode: false

      - name: Download the coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: coverage-reports
          pattern: coverage-*

      # With a single matching artifact, download-artifact puts its file straight into
      # coverage-reports/ instead of a folder named after it, so find the tables rather than
      # naming their paths. Sorted, backend comes before frontend.
      - name: Build the comment
        run: |
          mapfile -t tables < <(find coverage-reports -name component-coverage.md | sort)
          if [ "${#tables[@]}" -eq 0 ]; then
            echo "::warning::No coverage tables were downloaded, so no coverage comment is posted."
            exit 0
          fi
          python3 scripts/coverage_comment.py "${tables[@]}" --output "$RUNNER_TEMP/coverage-comment.md"

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -f "$RUNNER_TEMP/coverage-comment.md" ] || exit 0
          marker='<!-- component-coverage -->'
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@"$RUNNER_TEMP/coverage-comment.md"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$RUNNER_TEMP/coverage-comment.md"
          fi

  image-size-comment:
    name: Comment the image size on the pull request
    # Compares the image the build job just measured with the published edge image, which
    # is main's latest build. One comment, updated by later pushes. A fork pull
    # request has a read-only token, so it gets the job summary instead. Not part of
    # ci-passed: a missing comment should not fail a pull request.
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the comment script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/image_size_comment.py
            scripts/measure_image_size.py
          sparse-checkout-cone-mode: false

      - name: Download this pull request's image size
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-size
          path: image-size

      # edge is the image built from main and is public, so a fork can pull it too. If it
      # cannot be pulled the comment shows the new size alone.
      - name: Measure the published edge image
        run: |
          if docker pull --platform linux/amd64 ghcr.io/${{ github.repository }}:edge; then
            python3 scripts/measure_image_size.py ghcr.io/${{ github.repository }}:edge > "$RUNNER_TEMP/edge-size.json"
          fi

      - name: Build the comment
        run: >-
          python3 scripts/image_size_comment.py image-size/image-size.json
          --base "$RUNNER_TEMP/edge-size.json"
          --output "$RUNNER_TEMP/image-size-comment.md"

      # The raw measurements go in the log and, under the table, the summary, so a
      # figure that looks wrong can be checked.
      - name: Show the comment and the measurements
        run: |
          echo "pull request: $(cat image-size/image-size.json)"
          echo "edge: $(cat "$RUNNER_TEMP/edge-size.json" 2>/dev/null || echo 'not measured')"
          {
            cat "$RUNNER_TEMP/image-size-comment.md"
            echo
            echo '<details><summary>Measurements (bytes)</summary>'
            echo
            echo '```json'
            echo "{\"pull_request\": $(cat image-size/image-size.json),"
            echo " \"edge\": $(cat "$RUNNER_TEMP/edge-size.json" 2>/dev/null || echo null)}"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- image-size -->'
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@"$RUNNER_TEMP/image-size-comment.md"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@"$RUNNER_TEMP/image-size-comment.md"
          fi

  ci-passed:
    name: CI passed
    # One stable check to require in branch protection however the jobs above change.
    # Runs even when a needed job fails or is cancelled: a skipped dependency would
    # otherwise leave this check "skipped", which counts as passing. A job that was
    # skipped because nothing it covers changed is fine; one skipped because a job before
    # it failed is not, but that failure is itself in `needs` and fails this check.
    if: always()
    needs: [changes, typecheck-backend, generated-files, typecheck-frontend, frontend-tests, integration, e2e, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
