name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Fail rather than update uv.lock; poe's sync tasks pass this on to uv.
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a branch replaces its older run, but every commit on main keeps its
  # own, so a quick second merge does not leave the first without a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Work out which jobs are needed
    # A pull request that only changes documentation or repository housekeeping skips the
    # test jobs; see scripts/ci_changes.py for the rules. Everything else runs them all.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      e2e: ${{ steps.changes.outputs.e2e }}
      image: ${{ steps.changes.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Classify the changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run --script scripts/ci_changes.py

  typecheck-backend:
    name: Backend type check (mypy)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Run mypy
        run: uv run poe typecheck-backend

  generated-files:
    # A matrix so each generated file reports as its own check on the pull request.
    name: Generated files current (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: settings reference
            task: check-settings-docs
          - name: API schema
            task: check-schema
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Check ${{ matrix.name }}
        run: uv run poe ${{ matrix.task }}

  typecheck-frontend:
    name: Frontend type check (svelte-check)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Run svelte-check
        run: uv run poe typecheck-frontend

  frontend-tests:
    name: Frontend unit tests (Vitest)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Run the frontend unit tests
        run: uv run poe test-frontend

  integration:
    name: Backend Tests and Coverage
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Run backend unit and integration tests and enforce coverage
        run: uv run poe coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-shards:
    name: End-to-end shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium (a no-op when cached)
        run: uv run poe install-e2e-browser

      - name: Install the system libraries Chromium needs
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Run end-to-end tests
        run: uv run poe test-e2e --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # The report job merges these into one report and job summary.
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: frontend/blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: End-to-end report
    if: ${{ !cancelled() && needs.e2e-shards.result != 'skipped' }}
    needs: e2e-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge the shards into one report and summary
        run: >-
          npx playwright merge-reports
          --reporter=html,./tests/e2e/reporters/job-summary.ts
          ./all-blob-reports
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload the merged HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-cookies:
    name: End-to-end cookies (WebKit, Firefox)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cookies-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium, WebKit and Firefox (a no-op when cached)
        run: |
          uv run poe install-e2e-browser
          uv run poe install-e2e-cookie-browsers

      - name: Install the system libraries the browsers need
        run: npx playwright install-deps chromium webkit firefox
        working-directory: frontend

      - name: Run cookie tests in WebKit and Firefox
        run: uv run poe test-e2e-cookies

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-cookies
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end Tests (Playwright)
    # Keeps one stable check name for branch protection however the suite is split.
    if: always()
    needs: [e2e-shards, e2e-cookies]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every end-to-end job to pass
        env:
          SHARDS: ${{ needs.e2e-shards.result }}
          COOKIES: ${{ needs.e2e-cookies.result }}
        run: |
          echo "shards: ${SHARDS}, cookies: ${COOKIES}"
          # Both are skipped when nothing the tests cover has changed.
          for result in "${SHARDS}" "${COOKIES}"; do
            case "${result}" in success|skipped) ;; *) exit 1 ;; esac
          done

  build:
    name: Build and smoke test the image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  ci-passed:
    name: CI passed
    # One stable check to require in branch protection however the jobs above change.
    # Runs even when a needed job fails or is cancelled: a skipped dependency would
    # otherwise leave this check "skipped", which counts as passing. A job that was
    # skipped because nothing it covers changed is fine; one skipped because a job before
    # it failed is not, but that failure is itself in `needs` and fails this check.
    if: always()
    needs: [changes, typecheck-backend, generated-files, typecheck-frontend, frontend-tests, integration, e2e, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
