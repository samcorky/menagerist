name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  # Fail rather than update uv.lock; poe's sync tasks pass this on to uv.
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: Prek Checks (Lint, Typecheck, Unit Tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      # Read-only: autofix.yml applies the fixes to pull requests.
      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: --all-files

  integration:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv run poe sync-backend

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Run backend unit and integration tests and enforce coverage
        run: uv run poe coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: backend/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  e2e-shards:
    name: End-to-end shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium (a no-op when cached)
        run: uv run poe install-e2e-browser

      - name: Install the system libraries Chromium needs
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: Run end-to-end tests
        run: uv run poe test-e2e --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      # The report job merges these into one report and job summary.
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: frontend/blob-report
          if-no-files-found: ignore
          retention-days: 1

  e2e-report:
    name: End-to-end report
    if: ${{ !cancelled() && needs.e2e-shards.result != 'skipped' }}
    needs: e2e-shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Download the blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge the shards into one report and summary
        run: >-
          npx playwright merge-reports
          --reporter=html,./tests/e2e/reporters/job-summary.ts
          ./all-blob-reports
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never

      - name: Upload the merged HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-cookies:
    name: End-to-end cookies (WebKit, Firefox)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and generate the API client
        run: uv run poe sync-ci

      - name: Cache the Postgres image
        uses: ./.github/actions/postgres-image

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-cookies-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium, WebKit and Firefox (a no-op when cached)
        run: |
          uv run poe install-e2e-browser
          uv run poe install-e2e-cookie-browsers

      - name: Install the system libraries the browsers need
        run: npx playwright install-deps chromium webkit firefox
        working-directory: frontend

      - name: Run cookie tests in WebKit and Firefox
        run: uv run poe test-e2e-cookies

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-cookies
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end Tests (Playwright)
    # Keeps one stable check name for branch protection however the suite is split.
    if: always()
    needs: [e2e-shards, e2e-cookies]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every end-to-end job to pass
        env:
          SHARDS: ${{ needs.e2e-shards.result }}
          COOKIES: ${{ needs.e2e-cookies.result }}
        run: |
          echo "shards: ${SHARDS}, cookies: ${COOKIES}"
          test "${SHARDS}" = success && test "${COOKIES}" = success

  build:
    name: Build and smoke test the image
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  ci-passed:
    name: CI passed
    # One stable check to require in branch protection however the jobs above change.
    # Runs even when a needed job fails or is cancelled: a skipped dependency would
    # otherwise leave this check "skipped", which counts as passing.
    if: always()
    needs: [prek, integration, e2e, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every job to succeed
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
