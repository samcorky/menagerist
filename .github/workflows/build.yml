name: Build

# Builds the image and smoke tests it. Nothing is pushed unless `preview` is set.
# ci.yml calls it on pull requests and pushes to main, publish.yml calls it before it
# publishes, preview-image.yml calls it with `preview` for a labelled pull request, and
# it can be run by hand.
#
# With `preview`, the push-preview job pushes the image that was just smoke tested, not a
# rebuild, under a throwaway tag (pr-<number>, or preview-<branch> for a manual run; see
# scripts/preview_tag.py). Only that job may write packages.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: Push the tested image to GHCR as preview-<branch>, for deployed testing
        type: boolean
        default: false
  workflow_call:
    inputs:
      preview:
        description: Push the tested image to GHCR under a throwaway preview tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is worked out from the tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Only the small release group is installed here; keep it out of the
          # backend jobs' cache.
          cache-suffix: release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fails on a broken CalVer config; warns about a shallow clone or no tag yet.
      - name: Check the CalVer setup
        working-directory: backend
        run: uv run --locked --only-group release calver-scm doctor

      - name: Work out the build arguments
        id: args
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          version="$(cd backend && uv run --locked --only-group release calver-scm --format plain version)"
          description="$(python3 scripts/project_description.py)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${version}"
            echo "description=${description}"
            echo "commit=${COMMIT_SHA}"
            echo "branch=${BRANCH}"
            echo "timestamp=${timestamp}"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Built as menagerist:local; pushed as a preview: ${{ inputs.preview }}."

      - name: Build the image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ${{ steps.args.outputs.version }}
          DESCRIPTION: ${{ steps.args.outputs.description }}
          COMMIT_SHA: ${{ steps.args.outputs.commit }}
          BRANCH: ${{ steps.args.outputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_TIMESTAMP: ${{ steps.args.outputs.timestamp }}
          DIRTY: "false"
        with:
          # The Dockerfile reads .git from the build context, so build the checkout.
          source: .
          files: docker-bake.hcl
          targets: local
          # Same scope as the linux/amd64 build in publish.yml, which runs after this one
          # in a publish run and so reuses these layers.
          set: |
            local.cache-from=type=gha,scope=image-linux-amd64
            local.cache-to=type=gha,mode=max,scope=image-linux-amd64

      - name: Smoke test the image
        run: uv run --script scripts/smoke_test.py

      - name: Measure the image size
        run: python3 scripts/measure_image_size.py menagerist:local | tee "${RUNNER_TEMP}/image-size.json"

      # The image-size-comment job in ci.yml compares this with the published edge image.
      - name: Upload the image size
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-size
          path: ${{ runner.temp }}/image-size.json
          retention-days: 1

      # The push job runs on another runner, so it gets the tested image as a file.
      - name: Save the image for the preview push
        if: inputs.preview
        run: docker save menagerist:local | gzip -1 > "${RUNNER_TEMP}/preview-image.tar.gz"

      - name: Upload the image for the preview push
        if: inputs.preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar.gz
          # Already gzipped.
          compression-level: 0
          retention-days: 1

  push-preview:
    name: Push the preview image
    needs: build
    if: inputs.preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - name: Checkout the tag script and the comment action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/pr-comment
            scripts/preview_tag.py
          sparse-checkout-cone-mode: false

      - name: Work out the tag
        id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python3 scripts/preview_tag.py

      - name: Download the tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        id: push
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
        run: |
          gunzip -c "${RUNNER_TEMP}/preview-image/preview-image.tar.gz" | docker load
          docker tag menagerist:local "$IMAGE"
          docker push "$IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Write the comment
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '<!-- preview-image -->'
            echo '### Preview image'
            echo
            echo "Commit \`${COMMIT}\` passed the smoke test and was pushed for deployed testing (linux/amd64):"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Every push while the \`preview-image\` label is on replaces it. The tag is deleted when the pull request closes, or after 14 days without a push."
          } | tee "${RUNNER_TEMP}/preview-comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/pr-comment
        with:
          marker: "<!-- preview-image -->"
          body-file: ${{ runner.temp }}/preview-comment.md
          pr-number: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}
