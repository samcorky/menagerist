name: Build

# Builds the image and smoke tests it. Nothing is pushed.
# ci.yml calls it on pull requests and pushes to main, publish.yml calls it before it
# publishes, preview-image.yml calls it with `preview`, and it can be run by hand.
#
# With `preview`, the tested image is also uploaded as the `preview-image` artifact, so
# preview-image.yml can push exactly what passed. Every job here stays read-only: a
# called workflow may not ask for more than its caller grants, even in a job it skips,
# so a job that writes packages would stop ci.yml and publish.yml from starting.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      preview:
        description: Also upload the tested image as the preview-image artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is worked out from the tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Only the small release group is installed here; keep it out of the
          # backend jobs' cache.
          cache-suffix: release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Fails on a broken CalVer config; warns about a shallow clone or no tag yet.
      - name: Check the CalVer setup
        working-directory: backend
        run: uv run --locked --only-group release calver-scm doctor

      - name: Work out the build arguments
        id: args
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          version="$(cd backend && uv run --locked --only-group release calver-scm --format plain version)"
          description="$(python3 scripts/project_description.py)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${version}"
            echo "description=${description}"
            echo "commit=${COMMIT_SHA}"
            echo "branch=${BRANCH}"
            echo "timestamp=${timestamp}"
          } | tee -a "$GITHUB_OUTPUT"
          echo "No tags: this image is built as menagerist:local and not pushed."

      - name: Build the image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          VERSION: ${{ steps.args.outputs.version }}
          DESCRIPTION: ${{ steps.args.outputs.description }}
          COMMIT_SHA: ${{ steps.args.outputs.commit }}
          BRANCH: ${{ steps.args.outputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_TIMESTAMP: ${{ steps.args.outputs.timestamp }}
          DIRTY: "false"
        with:
          # The Dockerfile reads .git from the build context, so build the checkout.
          source: .
          files: docker-bake.hcl
          targets: local
          # Same scope as the linux/amd64 build in publish.yml, which runs after this one
          # in a publish run and so reuses these layers.
          set: |
            local.cache-from=type=gha,scope=image-linux-amd64
            local.cache-to=type=gha,mode=max,scope=image-linux-amd64

      - name: Smoke test the image
        run: uv run --script scripts/smoke_test.py

      - name: Measure the image size
        run: python3 scripts/measure_image_size.py menagerist:local | tee "${RUNNER_TEMP}/image-size.json"

      # The image-size-comment job in ci.yml compares this with the published edge image.
      - name: Upload the image size
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-size
          path: ${{ runner.temp }}/image-size.json
          retention-days: 1

      # preview-image.yml pushes it from another runner, so it gets the image as a file.
      - name: Save the image for the preview push
        if: inputs.preview
        run: docker save menagerist:local | gzip -1 > "${RUNNER_TEMP}/preview-image.tar.gz"

      - name: Upload the image for the preview push
        if: inputs.preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar.gz
          # Already gzipped.
          compression-level: 0
          retention-days: 1
