name: autofix.ci # needed by autofix.ci to securely identify the workflow

# Runs the pre-commit hooks on the files a pull request changes. Hooks that rewrite
# files (ruff, prettier, eslint, line endings) have their fixes pushed as a commit from
# the autofix.ci app, then every hook is checked once more, so this job fails on
# anything it could not fix. On Renovate branches it also repairs the npm lockfile first.
# The type checks and tests are separate jobs in ci.yml.
# autofix.ci never edits files under .github/workflows, so a workflow change has to be
# formatted by hand.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  autofix:
    name: "Hooks: prek (autofix)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Run as their own jobs in ci.yml.
      SKIP: mypy,pytest,svelte-check,vitest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit whose first parent is the base
          # branch, so HEAD~1..HEAD is exactly the files the pull request changes.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair the npm lockfile (Renovate)
        # Renovate's lockfile can lack the optional platform packages of a nested
        # dependency (lightningcss under @tailwindcss/node), which fails `npm ci`.
        # Resolving again with the same npm as CI restores them; Push fixes commits it.
        if: startsWith(github.head_ref, 'renovate/')
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Repair the uv lockfile (Renovate)
        # Renovate bumps requires-python and .python-version with a regex manager, which
        # leaves uv.lock stale and fails every UV_LOCKED step. Locking again restores it;
        # Push fixes commits it. UV_LOCKED is switched off here because it would make
        # `uv lock` refuse to write.
        if: startsWith(github.head_ref, 'renovate/')
        env:
          UV_LOCKED: "0"
        run: uv lock

      - name: Install the frontend dependencies
        uses: ./.github/actions/frontend-deps

      - name: Sync the backend and generate the API client
        run: uv run poe sync-ci-installed

      - name: Cache the hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Apply hook fixes
        # A hook that rewrites a file exits non-zero; autofix.ci commits those
        # rewrites below.
        run: uv run prek run --last-commit || true

      - name: Push fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "${{ startsWith(github.head_ref, 'renovate/') && 'chore(deps): apply lockfile and hook fixes' || 'style: apply hook fixes' }}"

      - name: Check hooks
        run: uv run prek run --last-commit
