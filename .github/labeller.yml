# Labels by changed paths, applied by pr-labeller.yml. Labels from the pull request title
# prefix are applied by the same workflow; labels are only ever added, never removed.
# Area labels: they say where a change is, not what kind of change it is, so they do not
# count towards the "at least one label" check and are not in release.yml.
"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**"

"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

# Sign-in, roles, permissions and access stances, wherever they are enforced.
"area: identity":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/src/app/modules/identity/**"
          - "backend/tests/modules/identity/**"
          - "backend/src/app/platform/config/identity*.py"
          - "backend/src/app/shared_kernel/access*.py"
          - "backend/src/app/shared_kernel/actor.py"
          - "backend/src/app/shared_kernel/authorisation.py"
          - "backend/src/app/entrypoints/api/shared/access*"
          - "backend/src/app/entrypoints/api/shared/*permission*"
          - "backend/src/app/entrypoints/api/shared/*authorisation*"
          - "backend/tests/**/*access_stances*"
          - "backend/tests/**/*permission*"
          - "backend/tests/**/*authorisation*"
          - "frontend/src/routes/login/**"
          - "frontend/src/routes/settings/account/**"
          - "frontend/src/lib/auth*"
          - "frontend/src/lib/api/auth-*"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
          - ".github/ISSUE_TEMPLATE/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/tests/**"
          - "frontend/tests/**"

CI/CD:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - "**/.pre-commit-config.yaml"

# Only when every changed file is a manifest or lock file, so a feature that adds a
# dependency is not filed under Dependencies.
dependencies:
  - changed-files:
      - all-globs-to-all-files:
          - "uv.lock"
          - "**/pyproject.toml"
          - "frontend/package.json"
          - "frontend/package-lock.json"
          - ".github/renovate.json"
