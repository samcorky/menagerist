# Groups the generated release notes (the "Generate release notes" button, or
# `gh release create --generate-notes`) by pull request label. A pull request appears
# under the first category it matches, so the order matters. Labels are applied by
# pr-labeller.yml and Renovate; see "Labels and release notes" in CONTRIBUTING.md.
changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Upgrade notes
      labels:
        - upgrade-note
    - title: Performance
      labels:
        - performance
    - title: Enhancements
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Security
      labels:
        - security
    - title: Dependencies
      labels:
        - dependencies
    - title: Housekeeping
      labels:
        - maintenance
        - tests
        - CI/CD
        - documentation
    - title: Other changes
      labels:
        - "*"
