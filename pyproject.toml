[project]
name = "menagerist-workspace"
version = "0.0.0"
description = "A lightweight, self-hostable and flexible platform for organising the things you care about."
requires-python = ">=3.14"

dependencies = [
    "menagerist",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "backend"
]

[tool.uv.sources]
menagerist = { workspace = true }

[dependency-groups]
dev = [
    "prek>=0.4.14",
    "poethepoet>=0.48.0"
]

[tool.poe]
verbosity = -1

[tool.poe.groups.setup]
heading = "Setup"

[tool.poe.groups.setup.tasks._install-hooks]
cmd = "prek install -f"
help = "Install or update local git hooks"

[tool.poe.groups.setup.tasks.sync-backend]
cmd = "uv sync --all-packages --group dev"
help = "Sync the backend environment with all workspace members and their dependency groups"

[tool.poe.groups.setup.tasks.repair-backend]
cmd = "uv sync --all-packages --group dev --reinstall"
help = "Force-reinstall all backend packages to repair a corrupted venv (e.g. after an interrupted sync). On Windows this reinstalls poe.exe itself, which is locked while it's the running process — invoke via `python -m poethepoet repair` (or `.venv/Scripts/python.exe -m poethepoet repair`) instead of `poe repair` if you hit an 'Access is denied' error"

[tool.poe.groups.setup.tasks.repair]
sequence = ["repair-backend"]
help = "Repair local backend"

[tool.poe.groups.setup.tasks.sync-frontend]
shell = "npm install"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Install frontend npm dependencies"

[tool.poe.groups.setup.tasks.install-e2e-browser]
shell = "npx playwright install chromium"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Download the Chromium build the Playwright e2e suite drives (no-op once installed)"

[tool.poe.groups.setup.tasks.install-e2e-deps]
# sudo needs a real terminal to prompt, which a poe subprocess doesn't get, and it
# resets PATH (picking root's older Node). So print the command rather than run it.
cmd = "echo 'Run in your own terminal: cd frontend && sudo env \"PATH=$PATH\" npx playwright install-deps chromium'"
help = "Linux only: print the one-off command that installs the system libraries Chromium needs"

[tool.poe.groups.setup.tasks.dump-schema]
cmd = "menagerist schema dump --output ../frontend/openapi.json"
cwd = "backend"
help = "Dump the backend's OpenAPI schema for frontend client generation"
deps = ["sync-backend"]

[tool.poe.groups.setup.tasks._run-frontend-generate]
shell = "npm run generate"
interpreter = ["powershell", "posix"]
cwd = "frontend"

[tool.poe.groups.setup.tasks.generate-frontend-client]
sequence = ["dump-schema", "_run-frontend-generate"]
help = "Generate the frontend's typed API client from the OpenAPI schema"

[tool.poe.groups.setup.tasks.generate-iso-data]
cmd = "uv run --script scripts/generate_iso_data.py"
help = "Regenerate shared/iso-data.json (ISO 3166-1 countries, ISO 4217 currencies) from pycountry"

[tool.poe.groups.setup.tasks.sync]
sequence = ["sync-backend", "sync-frontend", "install-e2e-browser", "generate-frontend-client"]
help = "Sync all project dependencies"

[tool.poe.groups.setup.tasks.init]
sequence = ["sync", "_install-hooks"]
help = "Initialize the local development environment"

[tool.poe.groups.quality]
heading = "Quality"

[tool.poe.groups.quality.tasks.format-backend]
cmd = "ruff format . ../scripts"
cwd = "backend"
help = "Format backend Python files with Ruff"

[tool.poe.groups.quality.tasks.lint-backend]
cmd = "ruff check . ../scripts"
cwd = "backend"
help = "Lint backend Python files with Ruff"

[tool.poe.groups.quality.tasks.lint-backend-fix]
cmd = "ruff check . ../scripts --fix"
cwd = "backend"
help = "Lint backend Python files with Ruff and apply safe fixes"

[tool.poe.groups.quality.tasks.lint-backend-fix-unsafe]
cmd = "ruff check . ../scripts --fix --unsafe-fixes"
cwd = "backend"
help = "Lint backend Python files with Ruff and apply safe and unsafe fixes"

[tool.poe.groups.quality.tasks.typecheck-backend]
cmd = "mypy"
cwd = "backend"
help = "Type-check backend Python files with mypy"

[tool.poe.groups.quality.tasks.test-backend]
shell = "coverage erase ; pytest -m 'not integration' --cov=app --cov-branch --cov-report="
interpreter = ["powershell", "posix"]
cwd = "backend"
help = "Run backend unit tests from a clean coverage dataset"

[tool.poe.groups.quality.tasks.test-backend-integration]
cmd = "pytest -m integration --cov=app --cov-append --cov-branch --cov-report="
cwd = "backend"
help = "Run backend integration tests, appending to unit test coverage"

[tool.poe.groups.quality.tasks.test-backend-all]
sequence = ["test-backend", "test-backend-integration"]
help = "Run unit + integration backend tests with combined coverage data"

[tool.poe.groups.quality.tasks.coverage-domain]
cmd = 'coverage report --include="src/app/modules/*/domain/*" --fail-under=100'
cwd = "backend"
help = "Enforce 100% coverage on domain layers"

[tool.poe.groups.quality.tasks.coverage-ports]
cmd = 'coverage report --include="src/app/modules/*/ports/*" --fail-under=100'
cwd = "backend"
help = "Enforce 100% coverage on port interfaces"

[tool.poe.groups.quality.tasks.coverage-application]
cmd = 'coverage report --include="src/app/modules/*/application/*" --fail-under=100'
cwd = "backend"
help = "Enforce 100% coverage on application use cases"

[tool.poe.groups.quality.tasks.coverage-shared-kernel]
cmd = 'coverage report --include="src/app/shared_kernel/*" --fail-under=100'
cwd = "backend"
help = "Enforce 100% coverage on the shared kernel"

[tool.poe.groups.quality.tasks.coverage-adapters]
cmd = 'coverage report --include="src/app/modules/*/adapters/*" --fail-under=80'
cwd = "backend"
help = "Enforce coverage threshold on adapters"

[tool.poe.groups.quality.tasks.coverage-platform]
cmd = 'coverage report --include="src/app/platform/*" --fail-under=70'
cwd = "backend"
help = "Enforce coverage threshold on platform/infrastructure wiring"

[tool.poe.groups.quality.tasks.coverage-status]
cmd = "uv run --script scripts/check_component_coverage.py"
cwd = "backend"
help = "Show per-component coverage percentages without failing locally"

[tool.poe.groups.quality.tasks.coverage-check]
cmd = "uv run --script scripts/check_component_coverage.py --strict"
cwd = "backend"
help = "Fail CI when any component is below its Codecov threshold"

[tool.poe.groups.quality.tasks.test-and-status]
sequence = ["test-backend-all", "coverage-status"]
help = "Run all backend tests and print per-component coverage status without failing"
deps = ["sync-backend"]

[tool.poe.groups.quality.tasks.coverage-report]
cmd = "coverage xml"
cwd = "backend"
help = "Write the combined coverage.xml for Codecov upload"

[tool.poe.groups.quality.tasks.coverage]
sequence = ["test-backend-all", "coverage-check", "coverage-report"]
help = "Run full backend test suite and enforce per-layer coverage thresholds"

[tool.poe.groups.quality.tasks.format-frontend]
shell = "npm run format"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Format frontend files with Prettier"

[tool.poe.groups.quality.tasks.lint-frontend]
shell = "npm run lint"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Lint frontend files with Prettier and ESLint"

[tool.poe.groups.quality.tasks.lint-frontend-fix]
shell = "npm run lint:fix"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Lint frontend files with ESLint and apply safe fixes"

[tool.poe.groups.quality.tasks.typecheck-frontend]
shell = "npm run check"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Type-check frontend files with svelte-check"

[tool.poe.groups.quality.tasks.test-frontend]
shell = "npx vitest run"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Run frontend unit tests (vitest)"

[tool.poe.groups.quality.tasks.format]
sequence = ["format-backend", "format-frontend"]
help = "Format all project code"

[tool.poe.groups.quality.tasks.lint]
sequence = ["lint-backend", "lint-frontend"]
help = "Lint all project code"

[tool.poe.groups.quality.tasks.typecheck]
sequence = ["typecheck-backend", "typecheck-frontend"]
help = "Type-check all project code"

[tool.poe.groups.quality.tasks._check-hooks]
shell = "prek run --all-files"
help = "Run all configured pre-commit checks against the full repository"

[tool.poe.groups.quality.tasks.validate-renovate]
cmd = "prek run renovate-config-validator --all-files"
help = "Validate Renovate config with prek"

[tool.poe.groups.quality.tasks._renovate-local]
shell = 'docker run --rm -e LOG_LEVEL=debug -v "${PWD}:/tmp/repo" -w /tmp/repo renovate/renovate --platform=local --dry-run=full'
cwd = "."
interpreter = ["powershell", "posix"]
help = "Run Renovate locally in dry-run mode"

[tool.poe.groups.quality.tasks.renovate-local]
sequence = ["validate-renovate", "_renovate-local"]
help = "Validate Renovate config, then run Renovate locally in dry-run mode"

[tool.poe.groups.quality.tasks.check]
sequence = ["_check-hooks", "coverage-check"]
help = "Run the repository checks and enforce the backend coverage gate"
deps = ["sync"]

[tool.poe.groups.quality.tasks.check-changed]
cmd = "prek run"
help = "Run pre-commit checks on changed files only"

[tool.poe.groups.quality.tasks.validate-compose]
cmd = "docker compose config --quiet"
help = "Validate the Docker Compose configuration"

[tool.poe.groups.quality.tasks.validate-smoke-compose]
cmd = "docker compose -f compose.yaml -f compose.smoke.yaml config --quiet"
help = "Validate compose.yaml merged with the smoke-test override"

[tool.poe.groups.quality.tasks.validate-e2e-compose]
cmd = "docker compose -f compose.yaml -f compose.e2e.yaml config --quiet"
help = "Validate compose.yaml merged with the e2e-test override"

[tool.poe.groups.quality.tasks.test]
sequence = ["test-backend", "test-frontend"]
help = "Run all unit tests"

[tool.poe.groups.quality.tasks._test-e2e-run]
shell = "npx playwright test"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Run the Playwright test suite (assumes the e2e db is up and migrated)"

[tool.poe.groups.quality.tasks._test-e2e-run-headed]
shell = "npx playwright test --headed"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Run the Playwright test suite with a visible browser window (assumes the e2e db is up and migrated)"

[tool.poe.groups.quality.tasks.test-e2e]
sequence = ["e2e-db-up", "e2e-migrate", "_test-e2e-run", "e2e-db-down"]
ignore_fail = true
help = "Run the Playwright e2e suite against an isolated, throwaway Postgres, tearing it down afterwards regardless of outcome (requires Docker)"

[tool.poe.groups.quality.tasks.test-e2e-headed]
sequence = ["e2e-db-up", "e2e-migrate", "_test-e2e-run-headed", "e2e-db-down"]
ignore_fail = true
help = "Same as test-e2e, but opens a visible browser window so you can watch the tests run"

[tool.poe.groups.quality.tasks._test-e2e-run-slow]
shell = "npx playwright test --headed"
interpreter = ["powershell", "posix"]
cwd = "frontend"
env = { PW_SLOWMO = "1000" }
help = "Run the Playwright test suite headed, with each action slowed down so it's watchable (assumes the e2e db is up and migrated)"

[tool.poe.groups.quality.tasks.test-e2e-slow]
sequence = ["e2e-db-up", "e2e-migrate", "_test-e2e-run-slow", "e2e-db-down"]
ignore_fail = true
help = "Same as test-e2e-headed, but slowed down (1s between actions) so you can actually follow along"

[tool.poe.groups.database]
heading = "Database"

[tool.poe.groups.database.tasks.db-up]
cmd = "docker compose up -d postgres --wait postgres"
help = "Start the local Postgres container"

[tool.poe.groups.database.tasks.db-down]
cmd = "docker compose down"
help = "Stop and remove local Docker Compose containers"

[tool.poe.groups.database.tasks.migrate]
cmd = "menagerist migrate upgrade"
cwd = "backend"
help = "Apply database migrations up to the latest revision"

[tool.poe.groups.database.tasks.e2e-db-up]
cmd = "docker compose -f compose.yaml -f compose.e2e.yaml up -d --wait postgres"
help = "Start the isolated Postgres container used by the Playwright e2e suite, waiting for its healthcheck before returning"

[tool.poe.groups.database.tasks.e2e-migrate]
cmd = "menagerist migrate upgrade"
cwd = "backend"
env = { MENAGERIST_DATABASE_URL = "postgresql+asyncpg://menagerist:menagerist@localhost:55433/menagerist" }
help = "Apply migrations to the isolated e2e Postgres database"

[tool.poe.groups.database.tasks.e2e-db-down]
cmd = "docker compose -f compose.yaml -f compose.e2e.yaml down -v"
help = "Stop and remove the isolated e2e Postgres container and its volume"

[tool.poe.groups.run]
heading = "Build & Run"

[tool.poe.groups.run.tasks.build-backend]
cmd = "uv build --package menagerist"
help = "Build sdist+wheel for the menagerist package"

[tool.poe.groups.run.tasks.build-frontend]
shell = "npm run build"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Build the frontend for production"

[tool.poe.groups.run.tasks.build]
sequence = ["build-backend", "build-frontend"]
help = "Build backend and frontend"

[tool.poe.groups.run.tasks.serve-backend]
deps = ["ensure-editable-backend"]
cmd = "menagerist serve --host 0.0.0.0 --reload"
help = "Run the backend API server with auto-reload for development"

[tool.poe.groups.run.tasks.ensure-editable-backend]
cmd = "uv pip install -e backend"
help = "Editable install of the backend package (Windows-friendly alternative to uv sync)"

[tool.poe.groups.run.tasks.serve-frontend]
shell = "npm run dev -- --host 0.0.0.0"
interpreter = ["powershell", "posix"]
cwd = "frontend"
help = "Run the frontend dev server with hot reload"

[tool.poe.groups.run.tasks.serve]
parallel = ["serve-backend", "serve-frontend"]
help = "Run the app for local development"
# Ctrl+C exits the server non-zero; without this poe reports it as a failed task.
ignore_fail = true

[tool.poe.groups.run.tasks._docker-version]
shell = "uv run --with hatch hatch --no-interactive version"
interpreter = ["powershell", "posix"]
cwd = "backend"

[tool.poe.groups.run.tasks.docker-build]
cmd = "docker buildx bake -f docker-bake.hcl local"
help = "Build the Menagerist Docker image, with VERSION set from hatch-vcs"
uses = { VERSION = "_docker-version" }

[tool.poe.groups.run.tasks.docker-config]
cmd = "docker compose config"
help = "Print the fully merged Docker Compose config (base + override applied)"

[tool.poe.groups.run.tasks.docker-up]
cmd = "docker compose up -d --force-recreate"
help = "Build and (re)start the stack detached"
deps = ["docker-build"]

[tool.poe.groups.run.tasks.docker-down]
cmd = "docker compose down"
help = "Stop and remove the stack"

[tool.poe.groups.run.tasks.smoke-test]
cmd = "uv run --script scripts/smoke_test.py"
help = "Smoke test the built image through its own compose.yaml"
deps = ["docker-build"]
