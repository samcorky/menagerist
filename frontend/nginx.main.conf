worker_processes 1;
# Headroom above worker_connections for log fds, temp files, upstream
# sockets — matches ammnt/nginx's own default, not compiled in anywhere.
worker_rlimit_nofile 2048;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Same fields as nginx's built-in combined format, plus XFF — without
    # this, $remote_addr is the proxy's IP whenever something (Traefik,
    # etc.) sits in front, since nginx.conf's own X-Forwarded-Proto map
    # already anticipates that case.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
}
