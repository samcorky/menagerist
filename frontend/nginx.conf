# Use the client-supplied Request-Id if present, otherwise nginx's built-in
# per-request UUID ($request_id is 32 lowercase hex chars, always unique).
map $http_request_id $effective_request_id {
    default $http_request_id;
    ""      $request_id;
}

# Preserve upstream protocol when behind a reverse proxy (e.g. Traefik).
# Falls back to the local scheme for direct, non-proxied requests.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Compress API JSON and SvelteKit JS/CSS — both compress heavily.
# gzip_proxied any is required because /api/ responses come from the
# proxied upstream; nginx skips gzip on proxied responses by default.
# gzip_vary adds Vary: Accept-Encoding so intermediate caches key on it.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

server {
    listen 8080 default_server;
    server_name _;

    # SvelteKit content-hashes every filename under _app/immutable/ at build
    # time, so these assets can be cached permanently by the browser.
    # ^~ takes priority over the regex location below.
    location ^~ /_app/immutable/ {
        root /usr/share/nginx/html;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Other versioned static assets — short cache as a safe default.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Block hidden files and dot-directories that are not used by the app.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # API proxy — forward real client IP and protocol.
    # ^~ takes priority over regex static asset location above.
    #
    # No add_header directives here: SecurityHeadersMiddleware (backend) is
    # the single authoritative source for both security headers and
    # Cache-Control on every /api/ response — including per-route overrides
    # like immutable media-content caching. nginx `add_header` appends
    # rather than replacing an upstream header of the same name, so adding
    # a blanket Cache-Control here would silently collide with (and, per
    # the "most restrictive wins" rule, defeat) whatever the backend set.
    # nginx just forwards whatever the backend sent.
    location ^~ /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Request-Id $effective_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /favicon.ico {
        return 301 /favicon.svg;
    }

    # SPA shell — never cache so users always receive the latest version.
    # add_header directives don't merge from the server block when set at
    # location scope, so all security headers are repeated here.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /200.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
    }
}
