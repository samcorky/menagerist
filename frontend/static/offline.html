<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Offline - Menagerist</title>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #0a0a0a;
				--muted: #737373;
				--accent: #1d1b18;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0a0a0a;
					--fg: #fafafa;
					--muted: #a3a3a3;
					--accent: #fafafa;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1rem;
				background: var(--bg);
				color: var(--fg);
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				text-align: center;
			}
			main {
				max-width: 24rem;
			}
			svg {
				width: 4rem;
				height: 4rem;
				color: var(--accent);
			}
			h1 {
				margin: 1rem 0 0.5rem;
				font-size: 1.25rem;
				font-weight: 600;
			}
			p {
				margin: 0 0 1.5rem;
				color: var(--muted);
			}
			button {
				min-height: 2.75rem;
				padding: 0 1.25rem;
				border: 0;
				border-radius: 0.5rem;
				background: var(--fg);
				color: var(--bg);
				font: inherit;
				font-weight: 500;
				cursor: pointer;
			}
			button:focus-visible {
				outline: 2px solid var(--fg);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
				<polyline
					points="8,50 20,16 32,34 44,16 56,50"
					stroke="currentColor"
					stroke-width="4"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
				<g fill="currentColor">
					<circle cx="8" cy="50" r="4" />
					<circle cx="20" cy="16" r="4" />
					<circle cx="32" cy="34" r="4" />
					<circle cx="44" cy="16" r="4" />
					<circle cx="56" cy="50" r="4" />
				</g>
			</svg>
			<h1>You're offline</h1>
			<p>Menagerist needs a connection to reach your collection. Check your connection, then try again.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
