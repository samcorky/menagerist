repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier format
        entry: npm run format
        language: system
        types_or:
          - javascript
          - ts
          - json
          - svelte
          - css
          - markdown

      - id: eslint
        name: eslint check
        entry: npm run lint
        language: system
        types_or:
          - javascript
          - ts
          - svelte
        pass_filenames: false
