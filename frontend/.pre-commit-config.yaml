repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier format
        entry: uv run poe format-frontend
        language: system
        types_or:
          - javascript
          - ts
          - json
          - svelte
          - css
          - markdown
        pass_filenames: false

      - id: eslint
        name: eslint check
        entry: uv run poe lint-frontend
        language: system
        types_or:
          - javascript
          - ts
          - svelte
        pass_filenames: false

      - id: svelte-check
        name: svelte-check (types + svelte rules)
        entry: uv run poe typecheck-frontend
        language: system
        types_or:
          - ts
          - svelte
        pass_filenames: false

      - id: vitest
        name: run frontend unit tests (vitest)
        entry: uv run poe test-frontend
        language: system
        types_or:
          - javascript
          - ts
          - svelte
        pass_filenames: false
