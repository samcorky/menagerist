<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<!-- The same preview for every link. The server fills each data-branding tag from the
		     instance's branding (backend entrypoints/api/shell_branding.py); the content here
		     is the default it shows without the server. -->
		<meta
			name="description"
			content="A self-hostable platform for organising the things you care about."
			data-branding="description"
		/>
		<meta property="og:site_name" content="Menagerist" data-branding="name" />
		<meta property="og:title" content="Menagerist" data-branding="name" />
		<meta
			property="og:description"
			content="A self-hostable platform for organising the things you care about."
			data-branding="description"
		/>
		<meta property="og:url" content="/" data-branding="page-url" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="/share-image.png" data-branding="absolute-url" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Menagerist mark beside its name." />
		<meta name="twitter:card" content="summary_large_image" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- Kept in step with the theme by the script below and lib/theme.svelte.ts (THEME_COLOURS). -->
		<meta name="theme-color" content="#ffffff" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Menagerist" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme') || 'system';
					var dark =
						t === 'dark' ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', dark ? '#0a0a0a' : '#ffffff');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
