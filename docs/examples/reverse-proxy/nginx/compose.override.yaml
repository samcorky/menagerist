services:
  menagerist:
    ports: !override []
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - menagerist
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - menagerist
