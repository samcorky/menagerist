coverage:
  status:
    project:
      default:
        target: auto

component_management:
  individual_components:
    - component_id: domain
      name: Domain
      paths:
        - backend/src/app/modules/*/domain/**
      statuses:
        - type: project
          target: 100%
    - component_id: ports
      name: Ports
      paths:
        - backend/src/app/modules/*/ports/**
      statuses:
        - type: project
          target: auto
    - component_id: application
      name: Application
      paths:
        - backend/src/app/modules/*/application/**
      statuses:
        - type: project
          target: 100%
    - component_id: shared-kernel
      name: Shared Kernel
      paths:
        - backend/src/app/shared_kernel/**
      statuses:
        - type: project
          target: 100%
    - component_id: adapters
      name: Adapters
      paths:
        - backend/src/app/modules/*/adapters/**
      statuses:
        - type: project
          target: 80%
    - component_id: platform
      name: Platform
      paths:
        - backend/src/app/platform/**
      statuses:
        - type: project
          target: 70%

comment:
  layout: "header, diff, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  # A pull request that skips the backend job uploads no coverage, so post nothing.
  require_head: true
