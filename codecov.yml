coverage:
  status:
    project:
      default:
        target: auto

component_management:
  individual_components:
    - component_id: domain
      name: Domain
      paths:
        - src/app/modules/*/domain/**
      statuses:
        - type: project
          target: 100%
    - component_id: ports
      name: Ports
      paths:
        - src/app/modules/*/ports/**
      statuses:
        - type: project
          target: auto
    - component_id: application
      name: Application
      paths:
        - src/app/modules/*/application/**
      statuses:
        - type: project
          target: 100%
    - component_id: shared-kernel
      name: Shared Kernel
      paths:
        - src/app/shared_kernel/**
      statuses:
        - type: project
          target: 100%
    - component_id: adapters
      name: Adapters
      paths:
        - src/app/modules/*/adapters/**
      statuses:
        - type: project
          target: 80%
    - component_id: platform
      name: Platform
      paths:
        - src/app/platform/**
      statuses:
        - type: project
          target: 70%

comment:
  layout: "header, diff, components"
