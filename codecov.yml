coverage:
  status:
    # Informational: Codecov reports patch coverage without failing the check. The
    # component floors below are enforced by `poe coverage`, which is the real gate.
    patch:
      default:
        informational: true
    project:
      default:
        target: auto

flags:
  frontend:
    paths:
      - frontend/src/
    # A pull request that skips the frontend job uploads nothing, so keep the last report.
    carryforward: true

component_management:
  individual_components:
    - component_id: domain
      name: Domain
      paths:
        - backend/src/app/modules/*/domain/**
      statuses:
        - type: project
          target: 100%
    - component_id: ports
      name: Ports
      paths:
        - backend/src/app/modules/*/ports/**
      statuses:
        - type: project
          target: auto
    - component_id: application
      name: Application
      paths:
        - backend/src/app/modules/*/application/**
      statuses:
        - type: project
          target: 100%
    - component_id: shared-kernel
      name: Shared Kernel
      paths:
        - backend/src/app/shared_kernel/**
      statuses:
        - type: project
          target: 100%
    - component_id: adapters
      name: Adapters
      paths:
        - backend/src/app/modules/*/adapters/**
      statuses:
        - type: project
          target: 80%
    - component_id: platform
      name: Platform
      paths:
        - backend/src/app/platform/**
      statuses:
        - type: project
          target: 70%
    # Line coverage of the plain TypeScript the unit tests reach; `poe coverage-frontend`
    # enforces this target from the lcov report.
    - component_id: frontend
      name: Frontend
      paths:
        - frontend/src/**
      statuses:
        - type: project
          target: 90%

comment:
  layout: "header, diff, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  # A pull request that skips the backend job uploads no coverage, so post nothing.
  require_head: true
  # Show the components and files tables, not only the patch summary.
  hide_project_coverage: false
