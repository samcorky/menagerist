# Install the pre-commit, commit-msg and pre-push hooks with a plain `prek install`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Without this a hook with no `stages` of its own also runs on every push, which repeats the
# whole suite after the commit already ran it and CI runs it again. Only no-push-to-main (a
# push can be the only thing that checks it) and conventional-pre-commit (the commit message)
# name another stage. Four upstream hooks declare pre-push themselves, so they say pre-commit.
# The nested backend/ and frontend/ configs set the same default.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: pretty-format-json
        args:
          - --autofix
          - --no-sort-keys
        exclude: ^(frontend/|openapi\.json$)
      - id: check-added-large-files
        stages: [pre-commit]
        # The committed API schema is about 1 MB of generated JSON.
        exclude: ^openapi\.json$
      - id: check-executables-have-shebangs
        stages: [pre-commit]

  # Commit messages follow Conventional Commits; the types match .github/release.yml
  # and the labeller. Merge and fixup commits are allowed (no --strict).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - perf
          - security
          - docs
          - ci
          - test
          - build
          - chore
          - refactor
          - style
          - revert

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef # frozen: v0.27
    hooks:
      - id: validate-pyproject
        name: validate pyproject.toml files

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 59ed650679a395f9f7446e473322c74d8cf39e93 # frozen: 44.209.0
    hooks:
      - id: renovate-config-validator
        name: Validate Renovate Config
        args: [--strict]
        files: ^\.github/renovate\.json$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
      - id: check-codecov
      - id: check-github-issue-forms

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # no-commit-to-branch (above) cannot see a feature branch pushed to main.
      - id: no-push-to-main
        name: do not push to main
        entry: uv run --script scripts/no_push_to_main.py
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

      # backend/.pre-commit-config.yaml already runs Ruff when backend/ changes, and its
      # tasks cover ../scripts too. These only fire for a change under scripts/, which
      # that project never sees. Same poe tasks, so the same locked Ruff and rules.
      - id: ruff-check
        name: ruff check
        entry: uv run poe lint-backend-fix
        language: system
        files: '^scripts/.*\.py$'
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run poe format-backend
        language: system
        files: '^scripts/.*\.py$'
        pass_filenames: false

      # Spans backend/ and the root files it generates, so it lives here rather than in
      # the nested backend config.
      - id: settings-docs
        name: check the settings reference is current
        entry: uv run poe check-settings-docs
        language: system
        files: '^(backend/src/app/platform/config/|\.env\.example$|docs/settings\.md$)'
        pass_filenames: false

      # The committed OpenAPI schema follows the API, which spans the whole backend.
      - id: api-schema
        name: check the committed OpenAPI schema is current
        entry: uv run poe check-schema
        language: system
        files: '^(backend/(src|pyproject\.toml)|openapi\.json$)'
        pass_filenames: false

      - id: validate-compose
        name: validate docker compose
        entry: uv run poe validate-compose
        language: system
        files: '(^|/)(?:docker-)?compose(?:\.[a-zA-Z0-9_-]+)?\.ya?ml$'
        pass_filenames: false

      - id: validate-smoke-compose
        name: validate docker compose (smoke-test override)
        entry: uv run poe validate-smoke-compose
        language: system
        files: '(^|/)(?:docker-)?compose(?:\.[a-zA-Z0-9_-]+)?\.ya?ml$'
        pass_filenames: false

      - id: validate-e2e-compose
        name: validate docker compose (e2e override)
        entry: uv run poe validate-e2e-compose
        language: system
        files: '(^|/)(?:docker-)?compose(?:\.[a-zA-Z0-9_-]+)?\.ya?ml$'
        pass_filenames: false
